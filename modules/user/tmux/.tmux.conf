set -g prefix C-s
unbind C-b
bind-key C-s send-prefix

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%d'
set -g history-limit 50000
set -g escape-time 0
set -g focus-events on
set -g allow-passthrough on
set -s set-clipboard on
set -g extended-keys on
set -g extended-keys-format csi-u

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off
setw -g aggressive-resize on
set -g mouse on

setw -g mode-keys vi
set -g status-keys vi

bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

# Pane navigation
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# Direct pane navigation with Alt + hjkl (no prefix)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Last window toggle
bind -r ^ last-window

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Switch windows using Alt + 1-5 without prefix
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5

# Lazygit window
bind G new-window -n 'lazygit' -c "#{pane_current_path}" lazygit

# Sessions
bind S command-prompt -p "New Session:" "new-session -A -s '%%'"
bind X confirm-before -p "Kill session #S? (y/n)" kill-session

# Popup session picker
bind P display-popup -E "\
  find ~/Projects ~/ ~/.config -mindepth 1 -maxdepth 1 -type d 2>/dev/null | \
  fzf --reverse --header 'Select directory:' | \
  xargs -r -I {} tmux new-session -A -s \"$(basename {})\" -c \"{}\""

# Copy mode & system clipboard
bind v copy-mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi Escape send-keys -X cancel
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'wl-copy 2>/dev/null || xclip -selection clipboard -in 2>/dev/null || cat >/dev/null'

set -g status-position bottom
set -g status-interval 5
set -g status-left-length 40
set -g status-right-length 80

set -g status-style "fg=white,bg=default"
set -g message-style "fg=black,bg=white"
set -g pane-border-lines simple
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=white"

set -g status-left "#{?client_prefix,#[bold] ^ ,}#[bold] #S "
set -g status-right "#[fg=colour245]#{b:pane_current_path} "

set -g status-justify centre
setw -g window-status-format " #I:#W "
setw -g window-status-current-format " #[bold]#I:#W "

# Automatically balance panes with equal horizontal width
set-hook -g after-split-window "select-layout even-horizontal"
set-hook -g pane-exited "select-layout even-horizontal"

