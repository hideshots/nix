set -g prefix C-s
unbind C-b
bind-key C-s send-prefix

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB"
set -g history-limit 50000
set -g escape-time 0
set -g focus-events on

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mouse on

setw -g mode-keys vi
set -g status-keys vi

bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Popup session picker
bind P display-popup -E "\
  find ~/Projects ~/ ~/.config -mindepth 1 -maxdepth 1 -type d 2>/dev/null | \
  fzf --reverse --header 'Select directory:' | \
  xargs -r -I {} tmux new-session -A -s \"$(basename {})\" -c \"{}\""

# Copy to system clipboard when possible
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'wl-copy 2>/dev/null || xclip -selection clipboard -in 2>/dev/null || cat >/dev/null'

set -g status-position bottom
set -g status-interval 5
set -g status-left-length 40
set -g status-right-length 80

set -g status-style "fg=white,bg=default"
set -g message-style "fg=black,bg=white"
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=white"

set -g status-left "#[bold] #S "
set -g status-right "#[fg=colour245]%Y-%m-%d %H:%M "

setw -g window-status-format " #I:#W "
setw -g window-status-current-format " #[bold]#I:#W "
