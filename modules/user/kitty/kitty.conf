include ~/.cache/wal/colors-kitty.conf

font_family family="SF Pro Mono"
font_size 14.0
clipboard_control write-clipboard write-primary no-append 
shell_integration enabled
term xterm-kitty
shell sh -c "if tmux has-session 2>/dev/null; then target=\$(tmux list-windows -a -F '#{window_activity} #{session_name}:#{window_index}' 2>/dev/null | sort -n | tail -1 | cut -d' ' -f2); if [ -n \"\$target\" ]; then tmux attach -t \"\$target\"; else tmux attach; fi; fi; exec \${SHELL:-zsh}"
map_timeout 1.2
allow_remote_control yes
listen_on unix:/tmp/kitty.sock

tab_title_template "{index}:{session_name} {title}"
enabled_layouts splits,tall,fat,grid,stack,horizontal,vertical
tab_switch_strategy previous
tab_bar_style powerline

cursor_trail 1
cursor_trail_start_threshold 1
cursor_trail_decay 0.01 0.20
cursor_beam_thickness 2.0
cursor_shape beam

confirm_os_window_close 0
hide_window_decorations 1
scrollback_lines 10000
scrollback_pager nvim --cmd "set eventignore=FileType" +"nnoremap q ZQ" +"call nvim_open_term(0, {})" +"set nomodified nolist nonumber" +"$" -
enable_audio_bell no
bell_on_tab none

background_opacity 0.0
dynamic_background_opacity yes
window_padding_width 4

background #000000
foreground #c1c1c1
selection_background #c1c1c1
selection_foreground #000000
url_color #999999
cursor #c1c1c1
active_border_color #333333
inactive_border_color #121212
active_tab_background #000000
active_tab_foreground #c1c1c1
inactive_tab_background #121212
inactive_tab_foreground #999999
tab_bar_background #121212

color0 #000000
color4 #888888
color5 #999999
color6 #aaaaaa
color7 #c1c1c1
color8 #333333
color12 #888888
color13 #999999
color14 #aaaaaa
color15 #c1c1c1
color16 #aaaaaa
color17 #444444
color18 #121212
color19 #222222
color20 #999999
color21 #999999

# Layouts
map ctrl+space>space next_layout
map ctrl+space>z toggle_layout stack
map ctrl+space>alt+1 goto_layout horizontal
map ctrl+space>alt+2 goto_layout vertical
map ctrl+space>alt+3 goto_layout fat
map ctrl+space>alt+4 goto_layout tall
map ctrl+space>alt+5 goto_layout grid
map ctrl+space>alt+6 goto_layout fat:mirrored=true
map ctrl+space>alt+7 goto_layout tall:mirrored=true
map ctrl+space>= reset_window_sizes

# Tabs
map ctrl+space>c new_tab_with_cwd
map ctrl+space>n next_tab
map ctrl+space>p previous_tab
map ctrl+space>w select_tab
map ctrl+space>, set_tab_title " "
map ctrl+space>shift+w close_tab
map ctrl+space>1 goto_tab 1
map ctrl+space>2 goto_tab 2
map ctrl+space>3 goto_tab 3
map ctrl+space>4 goto_tab 4
map ctrl+space>5 goto_tab 5
map ctrl+space>6 goto_tab 6
map ctrl+space>7 goto_tab 7
map ctrl+space>8 goto_tab 8
map ctrl+space>9 goto_tab 9
map ctrl+space>0 goto_tab 10

# Panes
map ctrl+space>enter new_window_with_cwd
map ctrl+space>% launch --location=vsplit --cwd=current
map ctrl+space>" launch --location=hsplit --cwd=current
map ctrl+space>' launch --location=hsplit --cwd=current

map ctrl+space>h neighboring_window left
map ctrl+space>j neighboring_window bottom
map ctrl+space>k neighboring_window top
map ctrl+space>l neighboring_window right
map ctrl+space>left neighboring_window left
map ctrl+space>down neighboring_window bottom
map ctrl+space>up neighboring_window top
map ctrl+space>right neighboring_window right

map ctrl+space>o next_window
map ctrl+space>; nth_window -1
map ctrl+space>q focus_visible_window
map ctrl+space>x close_window
map ctrl+space>. set_window_title " "

# Move panes
map ctrl+space>shift+h move_window left
map ctrl+space>shift+j move_window bottom
map ctrl+space>shift+k move_window top
map ctrl+space>shift+l move_window right

# Resize panes
map ctrl+space>ctrl+left resize_window narrower
map ctrl+space>ctrl+right resize_window wider
map ctrl+space>ctrl+up resize_window taller
map ctrl+space>ctrl+down resize_window shorter

map ctrl+space>alt+left resize_window narrower 5
map ctrl+space>alt+right resize_window wider 5
map ctrl+space>alt+up resize_window taller 5
map ctrl+space>alt+down resize_window shorter 5

# Sessions
map ctrl+space>/ goto_session ~/.local/share/kitty/sessions
map ctrl+space>shift+s save_as_session --use-foreground-process --base-dir ~/.local/share/kitty/sessions
map ctrl+space>a save_as_session --relocatable --use-foreground-process --match=session:. .
map ctrl+space>d detach_tab
map ctrl+space>shift+d detach_window
map ctrl+space>shift+q close_session .

# Scrollback
map ctrl+space>[ show_scrollback
map ctrl+space>v show_scrollback
map ctrl+space>] paste_from_clipboard
map ctrl+space>f search_scrollback
map ctrl+space>g show_last_command_output

# Kitty controls
map ctrl+space>shift+c edit_config_file
map ctrl+space>r load_config_file
map ctrl+space>shift+p command_palette
map ctrl+space>t set_colors --all --configured background=#000000 foreground=#d78a4a selection_background=#7a3610 selection_foreground=#ffebd5 url_color=#ff7575 cursor=#ff9e64 active_border_color=#ba5e2b inactive_border_color=#4a2211 active_tab_background=#000000 active_tab_foreground=#ffb86c inactive_tab_background=#331508 inactive_tab_foreground=#9e5a31 tab_bar_background=#000000 color0=#000000 color1=#e86662 color2=#cc9900 color3=#e69500 color4=#b87349 color5=#c96590 color6=#e3b891 color7=#dfbf9f color8=#8c5030 color9=#ff7571 color10=#e6af00 color11=#ffc226 color12=#c98860 color13=#e37ba5 color14=#ffddb8 color15=#fff3e8
map ctrl+space>: kitty_shell
map ctrl+space>? show_kitty_doc conf
