include ~/.cache/wal/colors-kitty.conf

font_family family="SF Pro Mono"
font_size 14.0

clipboard_control write-clipboard write-primary read-clipboard read-primary
shell_integration enabled
term xterm-kitty
map_timeout 1.2

tab_title_template "{index}:{session_name} {title}"
enabled_layouts splits,tall,fat,grid,stack,horizontal,vertical
tab_switch_strategy previous
tab_bar_style powerline

cursor_trail 1
cursor_trail_start_threshold 1
cursor_trail_decay 0.01 0.20
cursor_beam_thickness 2.0
cursor_shape beam

confirm_os_window_close 0
hide_window_decorations 1
scrollback_lines 10000
enable_audio_bell no
bell_on_tab none

background_opacity 0.5
dynamic_background_opacity yes

background #000000
foreground #c1c1c1
selection_background #c1c1c1
selection_foreground #000000
url_color #999999
cursor #c1c1c1
active_border_color #333333
inactive_border_color #121212
active_tab_background #000000
active_tab_foreground #c1c1c1
inactive_tab_background #121212
inactive_tab_foreground #999999
tab_bar_background #121212

color0 #000000
color4 #888888
color5 #999999
color6 #aaaaaa
color7 #c1c1c1
color8 #333333
color12 #888888
color13 #999999
color14 #aaaaaa
color15 #c1c1c1
color16 #aaaaaa
color17 #444444
color18 #121212
color19 #222222
color20 #999999
color21 #999999

# Layouts
map ctrl+b>space next_layout
map ctrl+b>z toggle_layout stack
map ctrl+b>alt+1 goto_layout horizontal
map ctrl+b>alt+2 goto_layout vertical
map ctrl+b>alt+3 goto_layout fat
map ctrl+b>alt+4 goto_layout tall
map ctrl+b>alt+5 goto_layout grid
map ctrl+b>alt+6 goto_layout fat:mirrored=true
map ctrl+b>alt+7 goto_layout tall:mirrored=true
map ctrl+b>= reset_window_sizes

# Tabs
map ctrl+b>c new_tab_with_cwd
map ctrl+b>n next_tab
map ctrl+b>p previous_tab
map ctrl+b>w select_tab
map ctrl+b>, set_tab_title " "
map ctrl+b>shift+w close_tab
map ctrl+b>1 goto_tab 1
map ctrl+b>2 goto_tab 2
map ctrl+b>3 goto_tab 3
map ctrl+b>4 goto_tab 4
map ctrl+b>5 goto_tab 5
map ctrl+b>6 goto_tab 6
map ctrl+b>7 goto_tab 7
map ctrl+b>8 goto_tab 8
map ctrl+b>9 goto_tab 9
map ctrl+b>0 goto_tab 10

# Panes
map ctrl+b>enter new_window_with_cwd
map ctrl+b>' launch --location=vsplit --cwd=current
map ctrl+b>% launch --location=hsplit --cwd=current

map ctrl+b>h neighboring_window left
map ctrl+b>j neighboring_window bottom
map ctrl+b>k neighboring_window top
map ctrl+b>l neighboring_window right
map ctrl+b>left neighboring_window left
map ctrl+b>down neighboring_window bottom
map ctrl+b>up neighboring_window top
map ctrl+b>right neighboring_window right

map ctrl+b>o next_window
map ctrl+b>; nth_window -1
map ctrl+b>q focus_visible_window
map ctrl+b>x close_window
map ctrl+b>. set_window_title " "

# Move panes
map ctrl+b>shift+h move_window left
map ctrl+b>shift+j move_window bottom
map ctrl+b>shift+k move_window top
map ctrl+b>shift+l move_window right

# Resize panes
map ctrl+b>ctrl+left resize_window narrower
map ctrl+b>ctrl+right resize_window wider
map ctrl+b>ctrl+up resize_window taller
map ctrl+b>ctrl+down resize_window shorter

map ctrl+b>alt+left resize_window narrower 5
map ctrl+b>alt+right resize_window wider 5
map ctrl+b>alt+up resize_window taller 5
map ctrl+b>alt+down resize_window shorter 5

# Sessions
map ctrl+b>/ goto_session ~/.local/share/kitty/sessions
map ctrl+b>shift+s save_as_session --use-foreground-process --base-dir ~/.local/share/kitty/sessions
map ctrl+b>a save_as_session --relocatable --use-foreground-process --match=session:. .
map ctrl+b>d detach_tab
map ctrl+b>shift+d detach_window
map ctrl+b>shift+q close_session .

# Scrollback
map ctrl+b>[ show_scrollback
map ctrl+b>] paste_from_clipboard
map ctrl+b>f search_scrollback
map ctrl+b>g show_last_command_output

# Kitty controls
map ctrl+b>shift+c edit_config_file
map ctrl+b>r load_config_file
map ctrl+b>shift+p command_palette
map ctrl+b>t set_colors --all --configured background=#000000 foreground=#c1c1c1 selection_background=#222222 selection_foreground=#c1c1c1 url_color=#888888 cursor=#c1c1c1 active_border_color=#121212 inactive_border_color=#222222 active_tab_background=#000000 active_tab_foreground=#c1c1c1 inactive_tab_background=#121212 inactive_tab_foreground=#999999 tab_bar_background=#121212 color0=#000000 color1=#5f8787 color2=#d0dfee color3=#5f81a5 color4=#888888 color5=#999999 color6=#aaaaaa color7=#c1c1c1 color8=#121212 color9=#5f8787 color10=#d0dfee color11=#5f81a5 color12=#888888 color13=#999999 color14=#aaaaaa color15=#c1c1c1
map ctrl+b>: kitty_shell
map ctrl+b>? show_kitty_doc conf
